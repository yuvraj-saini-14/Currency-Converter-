<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeXchange</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styleFETCH_API/PORTFOLIO WEBSITE 2.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous" />
</head>

<body>
    <!-- Header Logo -->
    <header>
        <div class="logo">
            <div class="logo-icon">🌍</div>
            <span>GlobeXchange</span>
        </div>
    </header>

    <!-- Currency Converter -->
    <div class="container">
        <h2>Currency Converter</h2>
        <form>
            <div class="amount">
                <p>Enter Amount</p>
                <input value="1" type="text" />
            </div>

            <div class="dropdown">
                <div class="from">
                    <p>From</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="from-flag">
                        <select name="from"></select>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
                <div class="to">
                    <p>TO</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="to-flag">
                        <select name="to"></select>
                    </div>
                </div>
            </div>

            <div class="msg">1 USD = 80 INR</div>
            <button>Get Exchange Rate</button>
        </form>
    </div>

    <script src="codes.js"></script>
    <script src="fetch_API.js"></script>
</body>

</html>
